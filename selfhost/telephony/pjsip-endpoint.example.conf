; Provider-specific SIP credentials are supplied by the hospital's authorized carrier.
; Adapt authentication, transport, registrar, endpoint and dial pattern to that carrier.
[hospital-followup-auth]
type=auth
auth_type=userpass
username=REPLACE_WITH_CARRIER_USERNAME
password=REPLACE_WITH_CARRIER_PASSWORD

[hospital-followup-aor]
type=aor
contact=sip:REPLACE_WITH_CARRIER_SIP_HOST

[hospital-followup]
type=endpoint
transport=transport-udp
context=from-carrier
disallow=all
allow=alaw,ulaw
outbound_auth=hospital-followup-auth
aors=hospital-followup-aor
from_user=REPLACE_WITH_ASSIGNED_CALLER_ID
from_domain=REPLACE_WITH_CARRIER_SIP_HOST
direct_media=no

[hospital-followup-identify]
type=identify
endpoint=hospital-followup
match=REPLACE_WITH_CARRIER_SIP_IP
